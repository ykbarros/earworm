<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earworm &mdash; Name That Hit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e16">
<meta name="description" content="Earworm: name the hit from one second of music. Split Second and Timeline, with USA and K-pop decks, on one phone or with everyone on their own.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
  :root{
    --ground:#0d0e16;
    --panel:#171a2b;
    --panel-2:#1f2438;
    --line:rgba(255,255,255,.10);
    --ink:#f4f5fb;
    --ink-dim:#a7adc6;
    --ink-faint:#6b7192;
    --good:#25c281;
    --miss:#ff6a5a;
    --m-split:#ff4f7b;
    --m-time:#2ee6c9;
    --accent:#ffb000;
    --accent-ink:#0d0e16;
    --display:"Arial Black","Helvetica Neue Bold","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body[data-mode="split"]{--accent:var(--m-split)}
  body[data-mode="timeline"]{--accent:var(--m-time)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;font-size:inherit}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
  input{font-family:inherit}

  .app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));position:relative}
  .flood{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% -12%, color-mix(in srgb,var(--accent) 38%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb,var(--accent) 9%, var(--ground)), var(--ground) 60%);
    transition:background .4s ease}
  .screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* type */
  .display{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
  .eyebrow{color:var(--ink-faint);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .dim{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .center{text-align:center}
  .small{font-size:13px}
  h2{margin:0}

  /* brand */
  .brand{padding:10px 2px 4px}
  .brand h1{font-family:var(--display);font-weight:900;margin:0;line-height:.86;font-size:clamp(48px,16.5vw,88px);letter-spacing:-.05em;text-transform:uppercase}
  .brand h1 i{font-style:normal;color:var(--m-split)}
  .brand .ko{font-size:15px;color:var(--ink-dim);margin-top:10px}
  .brand .ko b{color:var(--ink);font-weight:700}

  /* mode cards */
  .modes{display:flex;flex-direction:column;gap:12px}
  .mode{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 18px 22px;background:var(--panel);
    border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;
    transition:transform .12s ease}
  .mode:active{transform:scale(.98)}
  .mode .swatch{position:absolute;inset:0 auto 0 0;width:7px;background:var(--mc)}
  .mode .blob{position:absolute;top:-50px;right:-40px;width:150px;height:150px;border-radius:50%;background:var(--mc);opacity:.16;filter:blur(6px)}
  .mode .name{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.03em;text-transform:uppercase;color:var(--mc);position:relative;line-height:1}
  .mode .pitch{position:relative;color:var(--ink);font-size:15px;line-height:1.35}
  .pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}

  /* buttons */
  .cta{width:100%;padding:18px;border-radius:20px;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;
    box-shadow:0 12px 30px -12px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .1s ease}
  .cta:active{transform:translateY(2px) scale(.99)}
  .cta.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .cta .sub{display:block;font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;opacity:.75;margin-top:4px}
  .ghost{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-weight:700;font-size:13px}
  .ghost:active{transform:scale(.96)}
  .ghost.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .link{color:var(--accent);font-weight:700;font-size:14px;padding:6px 2px}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
  .topback{align-self:flex-start;color:var(--ink-dim);font-weight:700;font-size:14px;padding:6px 2px}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .seg button{padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  /* panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
  .card.tint{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:12px}
  .rules li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:10px;line-height:1.4;font-size:15px}
  .rules li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--display);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}

  /* inputs */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .inp{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:12px}
  .inp.big{font-family:var(--display);font-size:34px;text-align:center;padding:14px}
  .err{color:var(--miss);font-size:14px;font-weight:600}

  /* players */
  .plist{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}
  .p .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
  .p .dot.off{background:var(--ink-faint)}
  .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .you{color:var(--ink-faint);font-weight:600;font-size:12px}
  .p .x{color:var(--ink-faint);font-size:20px;line-height:1;padding:0 4px}
  .teambadge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line)}
  .t0{color:#ffb14a;background:rgba(255,177,74,.12)}
  .t1{color:#6fd3ff;background:rgba(111,211,255,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:15px}
  .chip.done{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  .chip.pick{background:var(--accent);color:var(--accent-ink);border-color:transparent}

  /* game top bar */
  .gtop{display:flex;align-items:center;gap:8px}
  .mchip{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px;color:var(--accent);letter-spacing:-.01em}
  .gtop .info{flex:1;color:var(--ink-dim);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:900;color:var(--ink-dim);font-size:16px;flex:none}

  /* prompt card */
  .prompt{border-radius:24px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .prompt::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
  .prompt .t{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,8vw,38px);line-height:.98;letter-spacing:-.025em;text-wrap:balance}
  .prompt .q{font-size:clamp(21px,6vw,27px);font-weight:800;line-height:1.2;text-wrap:balance}
  .scale{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13.5px;font-weight:700}
  .scale span{display:flex;align-items:center;gap:6px}
  .scale b{font-family:var(--display);font-size:18px;color:var(--accent)}
  .scale span:last-child{text-align:right}

  .hint{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.45}
  .hint b{color:var(--ink)}
  .scores{display:flex;gap:8px}
  .sc-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px;border:1.5px solid transparent}
  .sc-pill .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc-pill b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .sc-pill.act{border-color:currentColor}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ink-dim);font-weight:700;font-size:15px;padding:14px;text-align:center}
  .wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

  /* hold to peek */
  /* tap to reveal a secret */
  .peek{position:relative;border-radius:24px;min-height:180px;width:100%;background:color-mix(in srgb,var(--accent) 14%,var(--panel));
    border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;overflow:hidden;
    box-shadow:0 12px 30px -16px color-mix(in srgb,var(--accent) 80%,transparent)}
  .peek:active{transform:scale(.99)}
  .peek .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent)}
  .peek .cover svg{width:44px;height:44px}
  .peek .cover b{font-family:var(--display);text-transform:uppercase;font-size:20px;letter-spacing:.01em}
  .peek .secret{display:none;flex-direction:column;align-items:center;gap:2px}
  .peek .secret .num{font-family:var(--display);font-weight:900;font-size:120px;line-height:1;color:var(--accent)}
  .peek .secret small{color:var(--ink-dim);font-size:13px;font-weight:700}
  .peek.on .cover{display:none}
  .peek.on .secret{display:flex}
  .peek.on{background:var(--panel)}

  /* captain + theme scale */
  .capbar{display:flex;align-items:center;gap:12px}
  .capbar .crown{font-size:34px;line-height:1}
  .capname{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,9vw,40px);line-height:.95;letter-spacing:-.02em;color:var(--accent);word-break:break-word}
  .scale2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .scale2 div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel-2);font-weight:800;font-size:15px;line-height:1.15}
  .scale2 div:last-child{justify-content:flex-end;text-align:right}
  .scale2 b{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1}

  /* drag to reorder */
  .sortable .slot{touch-action:pan-y;will-change:transform}
  .sortable .slot.lift{position:relative;z-index:2;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);border-color:var(--accent);transition:none!important}
  .sortable .slot.shift{transition:transform .15s ease}
  .grip{margin-left:auto;display:flex;align-items:center;justify-content:center;width:44px;height:40px;margin-right:-6px;border-radius:10px;color:var(--ink-dim);touch-action:none;cursor:grab}
  .grip:active{cursor:grabbing;color:var(--accent)}
  .gripglyph{font-weight:900;color:var(--accent)}
  .handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}
  .handoff .to{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,13vw,64px);line-height:.9;letter-spacing:-.03em;color:var(--accent);word-break:break-word}
  .handoff .lbl{color:var(--ink-dim);font-size:15px}
  .handoff .warn{font-size:14px;color:var(--ink-faint);max-width:30ch;line-height:1.4}

  /* ordering / line */
  .order{display:flex;flex-direction:column;gap:6px}
  .slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:16px}
  button.slot{width:100%;text-align:left}
  .slot .n{font-family:var(--display);width:30px;text-align:center;color:var(--ink-faint);font-size:15px;flex:none}
  .slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .slot .val{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
  .slot.ok{border-color:color-mix(in srgb,var(--good) 60%,transparent);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
  .slot.bad{border-color:color-mix(in srgb,var(--miss) 60%,transparent);background:color-mix(in srgb,var(--miss) 12%,var(--panel))}
  .slot.hid .val{color:var(--ink-faint)}
  .slot.me{outline:2px solid var(--accent);outline-offset:-2px}
  .end{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:800;text-align:center;padding:2px}
  .gap{border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);border-radius:14px;padding:9px;font-weight:800;font-size:14px;
    background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .gap:active{background:color-mix(in srgb,var(--accent) 20%,transparent)}

  /* hearts / score */
  .banner{border-radius:20px;padding:16px;text-align:center;font-weight:800;font-size:17px}
  .banner.good{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
  .banner.bad{background:color-mix(in srgb,var(--miss) 14%,var(--panel));color:var(--miss)}
  .banner.neutral{background:var(--panel);color:var(--ink)}
  .banner .big{display:block;font-family:var(--display);font-size:38px;line-height:1;margin-bottom:4px;text-transform:uppercase;letter-spacing:-.02em}


  /* dial */
  .dialwrap{position:relative;user-select:none;-webkit-user-select:none}
  .dial{width:100%;height:auto;display:block;touch-action:none}
  .dial.drag{cursor:grab}
  .spec{display:flex;justify-content:space-between;gap:10px;margin-top:-4px}
  .spec div{flex:1;font-family:var(--display);text-transform:uppercase;font-size:clamp(16px,5vw,22px);line-height:1;letter-spacing:-.01em;padding:10px 12px;border-radius:14px}
  .spec .l{background:rgba(111,211,255,.14);color:#8fdcff}
  .spec .r{background:rgba(255,120,90,.14);color:#ff9b82;text-align:right}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
  .sheet .in{width:100%;max-width:540px;max-height:88dvh;overflow:auto;background:var(--ground);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(30px)}}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;animation:rise .2s ease both;max-width:90vw;text-align:center}
  .netbar{background:color-mix(in srgb,var(--miss) 18%,var(--panel));color:var(--ink);border:1px solid color-mix(in srgb,var(--miss) 45%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .room-code{font-family:var(--display);font-size:clamp(54px,18vw,80px);letter-spacing:.14em;line-height:1;color:var(--accent);text-align:center}
  hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

  /* ---------- Earworm ---------- */
  .scores{flex-wrap:wrap}
  .sc-pill{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);flex:1 1 30%}
  .sc-pill.act{color:var(--accent);border-color:var(--accent)}
  .stage{display:flex;gap:6px;justify-content:center}
  .stage span{flex:1;max-width:96px;text-align:center;padding:7px 0;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    font-family:var(--display);font-size:13px;color:var(--ink-faint);letter-spacing:.02em}
  .stage span.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .stage span.past{color:var(--ink-dim)}
  .player{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
  .playbtn{width:min(54vw,210px);aspect-ratio:1;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;box-shadow:0 18px 50px -14px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 0 0 10px rgba(0,0,0,.08);
    transition:transform .1s ease;position:relative}
  .playbtn:active{transform:scale(.97)}
  .playbtn .ic{font-size:44px;line-height:1}
  .playbtn b{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
  .playbtn small{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  .playbtn.busy{background:var(--panel-2);color:var(--ink-dim);box-shadow:none}
  .eq{display:flex;gap:5px;align-items:flex-end;height:44px}
  .eq i{width:8px;border-radius:4px;background:currentColor;animation:eq .5s ease-in-out infinite alternate}
  .eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s}
  @keyframes eq{from{height:8px}to{height:44px}}
  .gform{display:flex;flex-direction:column;gap:8px}
  .gform .row .inp{min-width:0}
  .inp.yr{max-width:110px;text-align:center;font-variant-numeric:tabular-nums}
  .songcard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .songcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
  .songcard .art{width:88px;height:88px;border-radius:14px;flex:none;background:var(--panel-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px}
  .songcard .tt{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(20px,6vw,26px);line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
  .songcard .ar{font-weight:800;font-size:16px;margin-top:6px;color:var(--ink)}
  .songcard .yr{font-family:var(--display);font-size:22px;color:var(--accent);margin-top:4px}
  .res{display:flex;flex-direction:column;gap:8px}

  .res .hd .at{font-size:12px;color:var(--ink-faint);font-weight:700}
  .res .hd b{font-family:var(--display);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
  .mks{display:flex;flex-wrap:wrap;gap:6px}
  .mk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:13.5px;font-weight:700;max-width:100%;
    background:color-mix(in srgb,var(--miss) 12%,var(--panel-2));color:var(--ink-dim);border:1px solid color-mix(in srgb,var(--miss) 35%,transparent)}
  .mk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .mk.ok{background:color-mix(in srgb,var(--good) 16%,var(--panel-2));color:var(--ink);border-color:color-mix(in srgb,var(--good) 45%,transparent)}

  .mk.none{background:var(--panel-2);border-color:var(--line);color:var(--ink-faint)}

  #ytbox.on{left:0;right:0;width:auto;inset:0;background:rgba(5,6,12,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #ytbox .frame iframe{width:320px;height:180px;display:block;border:0}
  #ytbox .cover{position:absolute;inset:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-size:24px;text-transform:uppercase}
  #ytbox.on .cover{display:flex}
  #ytbox .cover span{font-size:46px}
</style>

  setTimeout(() => { try { p && p.destroy(); } catch (e) {} }, 150);
  Net.peer = null; Net.conn = null; Net.conns = new Map(); Net.code = null; Net.lost = false;
}
function setRoomInUrl(code) {
  try { const u = new URL(location.href); if (code) u.searchParams.set("room", code); else u.searchParams.delete("room"); history.replaceState(null, "", u); } catch (e) {}
}
function goHome(msg) {
  teardown(); store.del("earworm-save");
  if (ROLE === "guest") { setRoomInUrl(""); U.joinCode = ""; }

/* ---------- SPLIT SECOND ---------- */
const stageRow = g => `<div class="stage">${[1, 2, 3].map(s => `<span class="${s === g.stage ? "on" : s < g.stage ? "past" : ""}">${s} sec</span>`).join("")}</div>`;
function guessForm(g, pid) {
  const d = U.drafts, more = g.stage < 3 ? `Wait for ${g.stage + 1} seconds` : "No idea";
  return `<div class="card gform">
    <div class="row"><span class="eyebrow grow">${ROLE === "pass" ? esc(nm(pid)) + "'s guess" : "Your guess"}</span><span class="pill">×${MULT[g.stage]} if right</span></div>
    <input class="inp" id="g-a" maxlength="60" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Artist" value="${esc(d["g-a"] || "")}" enterkeyhint="next">
    <input class="inp" id="g-t" maxlength="60" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Song title" value="${esc(d["g-t"] || "")}" enterkeyhint="next">

}
function statusChips(g) {
  return `<div class="chips">${g.roster.map(p => {
    const a = g.ans[p], w = g.more[p];
    return `<span class="chip ${a ? "done" : ""}">${a ? "🔒" : w ? "⏳" : "…"} ${esc(nm(p))}</span>`;
  }).join("")}</div>`;
}
function splitView() {
  const g = S.g, song = curSong(g), dev = isHostDevice();
  const lead = g.roster.slice().sort((a, b) => (g.score[b] || 0) - (g.score[a] || 0));
  let h = topbar(`Song ${g.n}/${g.songs} · ${DECKS[g.deck].short}`) + scoreStrip(lead, p => half(g.score[p] || 0));
  if (g.phase === "guess") {
    h += stageRow(g);
    const label = `${g.stage} second${g.stage > 1 ? "s" : ""}`;
    if (!inGame()) return h + (dev ? playBtn("ssPlay", label, "Play", g.played > 0) : "") + spectator();
    if (ROLE === "pass") {
      if (!g.played) return h + playBtn("ssPlay", label, "Everyone listen") + hint(g.stage === 1 ? "One second of a big hit. Ready?" : `Nobody's sure yet. Here's <b>${label}</b> from a different part of the song.`);
      const next = g.roster.find(p => !g.ans[p] && !g.more[p]);
      if (!U.peek) return h + handoff(nm(next), "Pass the phone to", "Everyone else, keep your guesses to yourself!")
        + `<div class="bottom"><button class="cta" data-a="peek">I'm ${esc(nm(next))}</button>${playBtn("ssPlay", "Play it again", "", true)}${statusChips(g)}</div>`;
      return h + guessForm(g, next) + playBtn("ssPlay", "Play it again", "", true);
    }
    // a room: the host's phone plays the music, everyone answers on their own phone
    if (dev) h += playBtn("ssPlay", label, g.played ? "Play again" : "Everyone listen", g.played > 0);
    if (!g.played) return h + (dev ? hint(g.stage === 1 ? "Play the first second when everyone's listening." : `Nobody's sure yet. Play <b>${label}</b> from another part of the song.`)
      : wait(`Listen to ${esc(nm(S.hostId))}'s phone`)) + statusChips(g);
    const a = g.ans[ME];
    if (a) h += `<div class="banner neutral"><span class="big">Locked in</span>after ${a.at} second${a.at > 1 ? "s" : ""}</div>`;
    else if (g.more[ME]) h += wait(`Waiting to hear ${g.stage + 1} seconds`);
    else h += guessForm(g, ME);
    return h + statusChips(g);
  }
  // reveal
  const host = ROLE === "pass" || ROLE === "host";
  h += songCard(song, g.vid);
  h += `<div class="res">${g.roster.map(p => {
    const a = g.ans[p], m = g.marks[p] || {}, pts = ssPts(g, p);
    if (!a || a.none) return `<div class="rw"><div class="hd"><span class="nm">${esc(nm(p))}</span><span class="at">no guess</span><b>0</b></div></div>`;
    const mk = (k, txt, cls) => host
      ? `<button class="mk ${cls}" data-a="ssMark" data-v="${p}" data-k="${k}" aria-label="Change mark"><span>${txt}</span></button>`
      : `<span class="mk ${cls}"><span>${txt}</span></span>`;
    const tick = ok => ok ? "✓" : "✗";
    return `<div class="rw"><div class="hd"><span class="nm">${esc(nm(p))}</span><span class="at">at ${a.at}s ×${MULT[a.at]}</span><b>+${half(pts)}</b></div>
      <div class="mks">${mk("a", `${tick(m.a)} ${a.a ? esc(a.a) : "—"}`, a.a ? (m.a ? "ok" : "") : (m.a ? "ok" : "none"))}
      ${mk("t", `${tick(m.t)} ${a.t ? esc(a.t) : "—"}`, a.t ? (m.t ? "ok" : "") : (m.t ? "ok" : "none"))}
      ${mk("y", `${m.y === 1 ? "✓" : m.y ? "½" : "✗"} ${a.y ? esc(a.y) : "—"}`, m.y === 1 ? "ok" : m.y ? "half" : a.y ? "" : "none")}</div></div>`;
  }).join("")}</div>`;
  if (host) h += `<div class="faint small center">Tap a guess to mark it right or wrong if the checker got it wrong.</div>`;
  const last = g.n >= g.songs || g.qi + 1 >= g.q.length;
  if (host) h += `<div class="bottom">${dev ? `<div class="linkrow"><button class="link" data-a="hearMore">▶ Play the chorus</button><button class="link" data-a="fixClips">Clips sounded off?</button></div>` : ""}
    <button class="cta" data-a="ssNext">${last ? "See the winner" : "Next song"}</button></div>`;
  else h += wait(`${esc(nm(S.hostId))} will start the next song`);
  return h;
}

/* ---------- TIMELINE ---------- */
function tlList(g, p, placing, mark) {
  const L = lineSongs(g, p);
  let rows = `<div class="end">▲ Earlier</div>`;
  const gap = i => placing ? `<button class="gap" data-a="tlPlace" data-v="${i}">＋ Here</button>` : "";
  const newRow = (s, ok) => `<div class="slot new ${ok ? "ok" : "bad"}"><span class="nm">${esc(s.t)}<small>${esc(s.a)}</small></span><span class="val">${s.y}</span></div>`;
  L.forEach((s, i) => {
    rows += gap(i);
    if (mark && mark.pos === i) rows += newRow(mark.song, mark.ok);
    rows += `<div class="slot"><span class="nm">${esc(s.t)}<small>${esc(s.a)}</small></span><span class="val">${s.y}</span></div>`;
  });
  rows += gap(L.length);
  if (mark && mark.pos === L.length) rows += newRow(mark.song, mark.ok);
  rows += `<div class="end">▼ Later</div>`;
  return `<div class="order tl">${rows}</div>`;
}
function timelineView() {
  const g = S.g, cur = tlPid(g), song = curSong(g), dev = isHostDevice();
  const me = ROLE !== "pass" && cur === ME;
  let h = topbar(`First to ${g.goal} · ${DECKS[g.deck].short}`)
    + scoreStrip(g.roster, p => `${(g.lines[p] || []).length}${g.tokens[p] ? ` <span class="tokens">★${g.tokens[p]}</span>` : ""}`, cur);
  const who = me ? "Your" : esc(nm(cur)) + "'s";
  h += `<div class="capbar"><span class="crown" aria-hidden="true">🎧</span><div class="grow"><div class="eyebrow">${who} turn</div><div class="capname">${me ? "You" : esc(nm(cur))}</div></div></div>`;
  if (g.phase === "listen") {
    if (dev) h += playBtn("tlPlay", `${TL_CLIP} seconds`, g.played ? "Play again" : "Everyone listen", g.played > 0);
    if (!g.played) {
      h += dev ? hint(me ? "Play the song, then put it in your timeline." : `Play the song, then <b>${esc(nm(cur))}</b> puts it in their timeline.`) : wait(`Listen to ${esc(nm(S.hostId))}'s phone`);
      return h + tlList(g, cur, false);
    }
    if (mine(cur) && inGame()) {
      const d = U.drafts;
      h += hint(`Where does it go? Name it too for a <b class="tokens">★</b> (optional).`);
      h += `<div class="row"><input class="inp" id="tl-a" maxlength="60" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Artist" value="${esc(d["tl-a"] || "")}">
        <input class="inp" id="tl-t" maxlength="60" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Song" value="${esc(d["tl-t"] || "")}"></div>`;
      h += tlList(g, cur, true);
      if (g.tokens[cur] > 0) h += `<div class="bottom"><button class="cta alt" data-a="tlSkip">Spend a ★ to skip this song</button></div>`;
      return h;
    }
    return h + wait(`${esc(nm(cur))} is placing the song`) + tlList(g, cur, false);
  }
  // reveal
  const host = ROLE === "pass" || ROLE === "host";
  h += songCard(song, g.vid);
  h += `<div class="banner ${g.ok ? "good" : "bad"}"><span class="big">${g.ok ? "Right spot!" : "Not quite"}</span>${g.ok ? "The card goes in the timeline." : `It's from ${song.y}, so the card is gone.`}</div>`;
  if (g.guess.a || g.guess.t) {
    const txt = `${g.named ? "✓" : "✗"} ${esc(g.guess.a || "—")} · ${esc(g.guess.t || "—")}`;
    h += `<div class="row" style="justify-content:center">${host ? `<button class="mk ${g.named ? "ok" : ""}" data-a="tlMark" aria-label="Change mark"><span>${txt}</span></button>` : `<span class="mk ${g.named ? "ok" : ""}"><span>${txt}</span></span>`}
      <span class="small ${g.named ? "tokens" : "faint"}">${g.named ? "+1 ★" : "no ★"}</span></div>`;
  }
  h += tlList(g, cur, false, { pos: g.pos, song, ok: g.ok });
  const willWin = g.ok && (g.lines[cur] || []).length + 1 >= g.goal;
  if (host || mine(cur)) h += `<div class="bottom">${dev ? `<div class="linkrow"><button class="link" data-a="hearMore">▶ Play the chorus</button><button class="link" data-a="fixClips">Clip sounded off?</button></div>` : ""}
    <button class="cta" data-a="tlNext">${willWin ? "See the winner" : "Next turn"}</button></div>`;
  else h += wait(`Next up: ${esc(nm(g.roster[(g.at + 1) % g.roster.length]))}`);
  return h;
}

/* ---------- game over ---------- */
function overView() {
  const g = S.g, m = MODES[S.mode];
  let head = "", sub = "", list = "";
  if (g.type === "split") {
    const ids = g.roster.slice().sort((a, b) => (g.score[b] || 0) - (g.score[a] || 0));
    const top = ids.length ? g.score[ids[0]] || 0 : 0, winners = ids.filter(p => (g.score[p] || 0) === top);
    head = ids.length === 1 ? `${half(top)} points` : winners.length > 1 ? "It's a tie!" : `${nm(winners[0])} wins!`;
    sub = ids.length === 1 ? `${g.got[ids[0]] || 0} of ${g.songs} songs scored` : winners.length > 1 ? winners.map(nm).join(" & ") + ` on ${half(top)}` : `${half(top)} points from ${g.songs} songs`;
    list = ids.map((p, i) => `<div class="slot"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span><span class="val">${half(g.score[p] || 0)}</span></div>`).join("");
  } else {
    const ids = g.roster.slice().sort((a, b) => (g.lines[b] || []).length - (g.lines[a] || []).length || (g.tokens[b] || 0) - (g.tokens[a] || 0));
    head = g.winner && player(g.winner) ? (g.roster.length === 1 ? "Timeline complete!" : `${nm(g.winner)} wins!`) : "Out of songs!";
    sub = g.winner ? `${g.goal} cards in ${g.turns} turns` : "Most cards wins";
    list = ids.map((p, i) => `<div class="slot"><span class="n">${i + 1}</span><span class="nm">${esc(nm(p))}</span><span class="val">${(g.lines[p] || []).length} 🃏</span></div>`).join("");
  }
  const host = isHostDevice();
  return `<section class="screen" style="justify-content:center">
    <div class="center"><span class="mchip">${m.name}</span></div>
    <div class="banner good"><span class="big">${esc(head)}</span>${esc(sub)}</div>
    <div class="stand">${list}</div>
    <div class="bottom">
      ${host ? `<button class="cta" data-a="again">Play ${m.name} again</button>
                <button class="cta alt" data-a="${ROLE === "pass" ? "changeGame" : "lobby"}">${ROLE === "pass" ? "Pick another game" : "Back to the lobby"}</button>`
             : wait(`Waiting for ${esc(nm(S.hostId))} to pick what's next`)}
      ${ROLE === "guest" ? `<button class="link" data-a="leave">Leave room</button>` : ""}
    </div>
  </section>`;
}

/* ---------- sheets ---------- */

  const s = U.sheet; if (!s) return "";
  let inner = "";
  if (s.k === "rules") {
    const k = s.mode;

      ${rulesBlock(k)}<button class="cta" data-a="close">Got it</button>`;
  } else if (s.k === "menu") {

      ${off.length ? `<div class="eyebrow">Remove a player from this game</div><div class="chips">${off.map(p => `<button class="chip" data-a="drop" data-v="${p}">${online(p) ? "" : "⚪ "}${esc(nm(p))}</button>`).join("")}</div>` : ""}
      ${ROLE === "pass" ? `<button class="cta alt" data-a="endPass">End game</button>` : ""}

  } else if (s.k === "modes") {
    inner = `<div class="eyebrow">Pick a game</div><div class="modes">${Object.keys(MODES).map(k => modeCard(k).replace('data-a="pick"', 'data-a="setMode"')).join("")}</div>
      <button class="link" data-a="close">Cancel</button>`;
  } else if (s.k === "ask") {
    inner = `<div class="q" style="font-size:22px;font-weight:800">${esc(s.text)}</div>
      <button class="cta" data-a="${s.then}" ${s.v ? `data-v="${esc(s.v)}"` : ""}>${esc(s.yes)}</button>
      <button class="cta alt" data-a="close">Cancel</button>`;
  } else if (s.k === "settings") {
    const fixes = Object.keys(store.get("earworm-times", {})).length, bad = store.get("earworm-bad", []).length;
    inner = `<div class="display" style="font-size:30px">YouTube settings</div>
      <div class="note">Earworm plays songs through YouTube on the phone that runs the game. A <b>YouTube Data API key</b> is optional: with one, Earworm checks each video and finds another upload when a song won't play, and it can play the songs that don't have a video saved yet.</div>
      <div class="field"><label for="ytkey">API key</label><input class="inp" id="ytkey" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(U.drafts.ytkey ?? U.key)}"></div>
      <div class="note">Saved on this phone only, never in the page. In Google Cloud, restrict the key to your website's address so nobody else can use it.</div>
      <button class="cta" data-a="saveKey">Save</button>
      <hr class="sep">
      <div class="row"><span class="grow note">Clip times you've fixed: <b>${fixes}</b></span><button class="ghost" data-a="copyFixes" ${fixes ? "" : "disabled"}>Copy</button></div>
      <div class="row"><span class="grow note">Songs that wouldn't play: <b>${bad}</b></span><button class="ghost" data-a="resetBad" ${bad ? "" : "disabled"}>Try again</button></div>
      <button class="link" data-a="close">Close</button>`;
  } else if (s.k === "fix") {
    const g = S && S.g; if (!g) return "";
    const song = curSong(g), key = curKey(g), c = clipsFor(song, key);
    const rows = (g.type === "split" ? [0, 1, 2] : [0]).map(i => {
      const len = g.type === "split" ? i + 1 : TL_CLIP;
      return `<div class="fixrow"><span class="eyebrow">${len} sec</span><span class="tm">${mmss(c[i])}</span>
        <span class="btns"><button class="ghost" data-a="nudgeClip" data-v="${i}:-5">−5</button><button class="ghost" data-a="nudgeClip" data-v="${i}:-1">−1</button>
        <button class="ghost" data-a="nudgeClip" data-v="${i}:1">+1</button><button class="ghost" data-a="nudgeClip" data-v="${i}:5">+5</button>
        <button class="ghost on" data-a="testClip" data-v="${i}" aria-label="Play this clip">▶</button></span></div>`;
    }).join("");
    inner = `<div class="display" style="font-size:28px">Fix the clips</div>
      <div class="note">${esc(song.t)} · ${esc(song.a)}. Move where each clip starts, tap ▶ to check it, and it's saved on this phone for next time.</div>
      ${rows}
      <div class="row"><button class="ghost" data-a="resetClip">Reset</button><span class="grow"></span><button class="cta" data-a="close" style="width:auto;padding:14px 24px">Done</button></div>`;
  }
  return `<div class="sheet" data-a="scrim"><div class="in" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ================= render ================= */
function view() {
  if (!S) return ({ home: homeView, mode: modeView, setup: setupView, host: hostView, join: joinView, connecting: connectingView }[U.screen] || homeView)();
  if (S.stage === "lobby") return lobbyView();
  if (S.stage === "over") return overView();
  const v = { split: splitView, timeline: timelineView }[S.mode]();
  return `<section class="screen">${v}</section>`;
}
let lastKey = "";
function render() {
  const mode = (S && S.mode) || (U.screen !== "home" && U.screen !== "join" ? U.pick : "") || "";
  document.body.dataset.mode = mode;
  const ae = document.activeElement;
  const keep = ae && ae.id && ae.tagName === "INPUT" ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const g = S && S.g;
  // only animate the screen when the "page" actually changes
  const key = S ? [S.stage, g && g.phase, g && (g.n || g.turns), g && g.qi, g && g.stage, g && g.played > 0, U.peek,
    g && g.type === "split" && g.phase === "guess" ? Object.keys(g.ans).length + "-" + Object.keys(g.more).length : ""].join("|") : U.screen + U.pick;
  app.innerHTML = view();
  if (key === lastKey) app.querySelectorAll(".screen").forEach(el => el.style.animation = "none");
  lastKey = key;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  layer.innerHTML = sheetView();
  if (S && S.stage === "over" && !U.cele) { U.cele = true; confetti(); }
  if (!S || S.stage !== "over") U.cele = false;
  syncTune();
}

/* ================= toast + confetti ================= */
let toastT;
function toast(msg) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff4f7b", "#2ee6c9", "#ffb000", "#25c281", "#9b6bff"];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[rnd(5)] }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ================= input handling ================= */
function inviteLink() {
  const u = new URL(location.href); u.search = ""; u.hash = "";
  u.searchParams.set("room", S.code);
  ["net", "peerhost"].forEach(k => { if (params.get(k)) u.searchParams.set(k, params.get(k)); });
  return u.toString();
}
async function share() {
  const url = inviteLink();
  try {
    if (navigator.share) { await navigator.share({ title: "Earworm", text: `Join my Earworm room: ${S.code}`, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
  catch (e) { prompt("Copy this link:", url); }
}
function addName() {
  const n = cleanName(U.drafts.newname);
  if (!n) return;
  if (U.pp.some(p => p.name.toLowerCase() === n.toLowerCase())) { toast(n + " is already playing"); return; }
  U.pp.push({ id: uid(), name: n });
  U.drafts.newname = ""; render();
  const el = $("#newname"); if (el) el.focus();
}
async function createRoom() {
  const name = cleanName(U.drafts.hostname ?? U.name);
  if (!name) { U.err = "Enter your name first."; render(); return; }
  U.name = name; store.set("earworm-name", name);
  U.err = ""; U.net = "Opening a room…"; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    const code = await hostRoom(newCode());
    if (tok !== U.conn) { try { Net.peer.destroy(); } catch (e) {} Net.peer = null; return; }
    ROLE = "host"; ME = uid();
    S = { v: 0, play: "room", code, mode: U.pick, hostId: ME, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)),
          players: [{ id: ME, name, on: true }], g: null };
    commit();
  } catch (e) { if (tok !== U.conn) return; U.screen = "host"; U.err = e.message; render(); }
}
async function doJoin(code, name) {
  U.err = ""; U.net = `Joining room ${code}…`; U.screen = "connecting"; render();
  const tok = U.conn = (U.conn || 0) + 1;
  try {
    await joinRoom(code, name);
    if (tok !== U.conn) { goHome(); return; }
    ROLE = "guest"; U.screen = "home";
    setRoomInUrl(code);   // so a reload slips straight back in
    store.set("earworm-save", { role: "guest", code, mode: S && S.mode, t: Date.now() });
    render();
  } catch (e) { if (tok !== U.conn) return; U.screen = "join"; U.err = e.message; render(); }
}
async function resume() {
  const sv = store.get("earworm-save", null); if (!sv) return;
  if (sv.role === "pass") { ROLE = "pass"; ME = null; S = sv.S; render(); return; }
  if (sv.role === "guest") { U.joinCode = sv.code; return doJoin(sv.code, U.name || "Player"); }
  U.net = `Reopening room ${sv.S.code}…`; U.screen = "connecting"; render();
  try {
    await hostRoom(sv.S.code, true);
    ROLE = "host"; ME = sv.me; S = sv.S;
    S.players.forEach(p => p.on = p.id === ME);
    commit();
  } catch (e) { U.screen = "home"; render(); toast(e.message); }
}
function submitGuess(pid) {
  const val = { a: U.drafts["g-a"] || "", t: U.drafts["g-t"] || "", y: U.drafts["g-y"] || "" };
  if (!val.a.trim() && !val.t.trim() && !val.y.trim()) { toast("Type at least one guess, or wait for more"); return; }
  if (val.y.trim() && !/^\d{4}$/.test(val.y.trim())) { toast("Years have 4 digits, like 1999"); return; }
  ["g-a", "g-t", "g-y"].forEach(k => delete U.drafts[k]);
  U.peek = false;
  act({ type: "ssGuess", v: pid, val });
  scrollTo(0, 0);
}
function setClip(i, val) {
  const g = S.g, key = curKey(g), c = clipsFor(curSong(g), key).slice(), all = store.get("earworm-times", {});
  const d = Tune.dur || 600;
  c[i] = clamp(Math.round(val), 0, Math.max(0, d - 3));
  all[key] = c; store.set("earworm-times", all); render();
}

document.addEventListener("input", e => {
  const t = e.target; if (!t.id) return;
  if (t.id === "joincode") t.value = t.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (t.id === "g-y") t.value = t.value.replace(/\D/g, "").slice(0, 4);
  U.drafts[t.id] = t.value;
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.id) return;
  const id = e.target.id;
  if (id === "newname") addName();
  else if (id === "hostname") createRoom();
  else if (id === "joincode" || id === "joinname") handle("joinRoom");
  else if (id === "g-a") $("#g-t") && $("#g-t").focus();
  else if (id === "g-t") $("#g-y") && $("#g-y").focus();
  else if (id === "g-y") { const b = document.querySelector('[data-a="ssGuess"]'); if (b) handle("ssGuess", b.dataset.v); }
  else if (id === "tl-a") $("#tl-t") && $("#tl-t").focus();
  else if (id === "tl-t" || id === "ytkey") e.target.blur();
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  if (el.dataset.a === "scrim" && e.target !== el) return;
  handle(el.dataset.a, el.dataset.v, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && U.sheet) { U.sheet = null; render(); } });

function ask(text, yes, then, v) { U.sheet = { k: "ask", text, yes, then, v }; render(); }
function handle(a, v, el) {
  switch (a) {
    /* ---- local navigation ---- */
    case "home": U.conn = (U.conn || 0) + 1; U.screen = "home"; U.err = ""; render(); scrollTo(0, 0); return;
    case "pick": U.pick = v; U.screen = "mode"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goSetup": U.screen = "setup"; render(); scrollTo(0, 0); return;
    case "goHost": U.screen = "host"; U.err = ""; render(); scrollTo(0, 0); return;
    case "goJoin": U.screen = "join"; U.err = ""; render(); return;
    case "addName": addName(); return;
    case "rmName": U.pp = U.pp.filter(p => p.id !== v); render(); return;
    case "startPass": {
      const m = MODES[U.pick]; if (U.pp.length < m.min || U.pp.length > m.max) return;
      ROLE = "pass"; ME = null;
      S = { v: 0, play: "pass", code: null, mode: U.pick, hostId: null, stage: "lobby", sets: JSON.parse(JSON.stringify(U.sets)),
            players: U.pp.map(p => ({ id: p.id, name: p.name, on: true })), g: null };
      startGame(); commit(); scrollTo(0, 0); return;
    }
    case "createRoom": createRoom(); return;
    case "joinRoom": {
      const code = String(U.drafts.joincode ?? U.joinCode).toUpperCase(), name = cleanName(U.drafts.joinname ?? U.name);
      if (code.length !== 4) { U.err = "Room codes are 4 letters."; render(); return; }
      if (!name) { U.err = "Enter your name."; render(); return; }
      U.joinCode = code; U.name = name; store.set("earworm-name", name);
      doJoin(code, name); return;
    }
    case "resume": resume(); return;
    case "reconnect": reconnect(false); return;
    case "share": share(); return;
    case "rules": U.sheet = { k: "rules", mode: (S && S.mode) || U.pick }; render(); return;
    case "menu": U.sheet = { k: "menu" }; render(); return;
    case "modePick": U.sheet = { k: "modes" }; render(); return;
    case "settings": U.sheet = { k: "settings" }; render(); return;
    case "close": case "scrim": U.sheet = null; render(); return;
    case "peek": U.peek = true; render(); { const f = $("#g-a"); if (f) f.focus(); } return;
    case "leave": ask("Leave this room?", "Leave", "yesLeave"); return;
    case "closeRoom": ask("Close the room for everyone?", "Close room", "yesClose"); return;
    case "endPass": ask("End this game?", "End game", "yesEnd"); return;
    case "yesLeave": case "yesClose": goHome(); return;
    case "yesEnd": { const k = S.mode; goHome(); U.pick = k; U.screen = "mode"; render(); return; }
    case "changeGame": { goHome(); return; }

    /* ---- settings ---- */
    case "saveKey": {
      U.key = String(U.drafts.ytkey ?? U.key).trim(); delete U.drafts.ytkey;
      store.set("earworm-ytkey", U.key); U.sheet = null; render(); toast(U.key ? "Key saved on this phone" : "Key removed"); return;
    }
    case "copyFixes": {
      const txt = JSON.stringify(store.get("earworm-times", {}), null, 1);
      navigator.clipboard.writeText(txt).then(() => toast("Copied. Send it over to make the fixes permanent."), () => prompt("Copy this:", txt));
      return;
    }
    case "resetBad": store.del("earworm-bad"); store.del("earworm-vid"); render(); toast("Those songs are back in the deck"); return;

    /* ---- music (this phone only) ---- */
    case "ssPlay": {
      const g = S.g; if (!g || g.phase !== "guess") return;
      if (Tune.clip(clipsFor(curSong(g), curKey(g))[g.stage - 1], g.stage)) act({ type: "ssPlayed", val: Tune.id });
      return;
    }
    case "tlPlay": {
      const g = S.g; if (!g || g.phase !== "listen") return;
      if (Tune.clip(clipsFor(curSong(g), curKey(g))[0], TL_CLIP)) act({ type: "tlPlayed", val: Tune.id });
      return;
    }
    case "hearMore": { const g = S.g; Tune.clip(clipsFor(curSong(g), curKey(g))[0], 30); return; }
    case "tuneRetry": { const w = wantSong(); if (w) Tune.prepare(w.song, w.key); return; }
    case "tuneSkip": { const g = S.g; if (g) act({ type: g.type === "split" ? "ssBad" : "tlBad", v: curKey(g) }); return; }
    case "unlock": Tune.unlocked = true; return;
    case "fixClips": U.sheet = { k: "fix" }; render(); return;
    case "nudgeClip": { const [i, d] = v.split(":").map(Number), g = S.g; setClip(i, clipsFor(curSong(g), curKey(g))[i] + d); return; }
    case "testClip": { const i = Number(v), g = S.g; Tune.clip(clipsFor(curSong(g), curKey(g))[i], g.type === "split" ? i + 1 : TL_CLIP); return; }
    case "resetClip": { const all = store.get("earworm-times", {}); delete all[curKey(S.g)]; store.set("earworm-times", all); render(); return; }

    /* ---- pass-mode settings before a game exists ---- */
    case "set":
      if (!S) {
        const k = el.dataset.k, d = DEFAULTS[U.pick][k];
        U.sets[U.pick][k] = typeof d === "string" ? String(v) : Number(v);
        store.set("earworm-sets", U.sets); render(); return;
      }
      act({ type: "set", k: el.dataset.k, v }); return;

    /* ---- game actions (go through the host) ---- */
    case "setMode": U.sheet = null; act({ type: "setMode", v }); return;
    case "ssGuess": submitGuess(v); return;
    case "ssMore": ["g-a", "g-t", "g-y"].forEach(k => delete U.drafts[k]); U.peek = false; act({ type: "ssMore", v }); scrollTo(0, 0); return;
    case "ssMark": act({ type: "ssMark", v, k: el.dataset.k }); return;
    case "tlPlace": {
      const val = { a: U.drafts["tl-a"] || "", t: U.drafts["tl-t"] || "" };
      delete U.drafts["tl-a"]; delete U.drafts["tl-t"];
      act({ type: "tlPlace", v, val }); scrollTo(0, 0); return;
    }
    case "drop": ask(`Remove ${nm(v)} from this game?`, "Remove", "yesDrop", v); return;
    case "yesDrop": U.sheet = null; act({ type: "drop", v }); return;
    case "lobby": U.sheet = null; act({ type: "lobby" }); return;
    case "ssNext": case "tlNext":
      U.peek = false; Tune.halt(); act({ type: a, v }); scrollTo(0, 0); return;
    default: act({ type: a, v });
  }
}

/* ================= boot ================= */
// test hook: lets automated checks read state (harmless in normal play)
window.__earworm = { get S() { return S; }, get ME() { return ME; }, get ROLE() { return ROLE; }, Tune, SONGS, matchList, autoMark, makeQueue };
render();
// reloaded a tab that was already in this room? slip straight back in
if (U.joinCode && tabStore.get("earworm-pid-" + U.joinCode) && U.name) doJoin(U.joinCode, U.name);
})();
</script>
